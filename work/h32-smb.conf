[global]
    workgroup = WORKGROUP
    netbios name = HISENSE-TV
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2_02
    server max protocol = SMB3
    server signing = mandatory
    smb ports = 445
    disable netbios = yes
    interfaces = lo wlan0 eth0
    bind interfaces only = yes
    hosts allow = 127.0.0.1 192.168.1.0/24
    hosts deny = ALL
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    server multi channel support = no
    log file = /var/log/samba/log.%m
    max log size = 200

[Condivisa]
    path = /srv/condivisa
    valid users = tv
    guest ok = no
    browseable = yes
    read only = no
    create mask = 0660
    directory mask = 0770
    follow symlinks = no
    wide links = no
    aio read size = 0
    aio write size = 0
    use sendfile = no
